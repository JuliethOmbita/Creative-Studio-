<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respira Conmigo</title>
<meta name="description" content="Juegos de respiración para niñas, niños y adolescentes: sentir, entender y calmar el cuerpo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8EF;
    --ink: #2E2A3B;
    --muted: #6B6580;
    --card: #FFFFFF;
    --line: #EBDFCF;
    --accent: #FF8A65;
    --accent-ink: #FFFFFF;
    --rojo: #E8505B;
    --amarillo: #F2A93B;
    --morado: #9B6BD3;
    --azul: #4A90D9;
    --verde: #2FAE7E;
    --shadow: 0 6px 18px rgba(80, 60, 30, .10);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.45;
    min-height: 100vh;
  }
  h1, h2, h3, .display { font-family: "Baloo 2", "Nunito", system-ui, sans-serif; line-height: 1.15; margin: 0; }
  h1 { font-size: clamp(32px, 7vw, 48px); }
  h2 { font-size: clamp(26px, 5.5vw, 36px); }
  h3 { font-size: 22px; }
  p { margin: .4em 0; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header.bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 20px; flex: 1; background: none; border: 0; text-align: left; padding: 0; }
  .chip-btn {
    border: 2px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 12px; font-size: 15px; font-weight: 700; min-height: 40px;
  }
  .chip-btn[aria-pressed="false"] { opacity: .55; }
  .brand { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chip-btn.player { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 1; }
  @media (max-width: 420px) {
    .brand { font-size: 18px; }
    .chip-btn { padding: 6px 10px; font-size: 14px; }
    .lbl { display: none; }
  }

  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 48px; }
  .screen { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .center { text-align: center; }
  .lead { color: var(--muted); font-size: 19px; }
  .stack > * + * { margin-top: 14px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
  .grid.tight { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

  .card {
    background: var(--card); border: 3px solid var(--line); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); text-align: left; width: 100%;
    transition: transform .15s ease, border-color .15s ease;
  }
  button.card:hover, button.card:focus-visible { transform: translateY(-3px); border-color: var(--c, var(--accent)); outline: none; }
  .card .big { font-size: 46px; line-height: 1; display: block; margin-bottom: 6px; }
  .card .t { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 22px; display: block; }
  .card .s { color: var(--muted); font-size: 16px; display: block; }
  .card.tinted { background: color-mix(in srgb, var(--c) 14%, var(--card)); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .card.selected { border-color: var(--c, var(--accent)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, var(--accent)) 30%, transparent); }

  .feel { text-align: center; padding: 22px 12px; }
  .feel .big { font-size: 64px; }
  .feel.huge .big { font-size: 88px; }

  .badge { display: inline-block; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: #A2462A; margin-top: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 999px; padding: 14px 26px; min-height: 52px;
    font-weight: 800; font-size: 19px; background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 70%, #000);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 70%, #000); }
  .btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px 14px; font-weight: 700; font-size: 16px; min-height: 42px;
  }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--accent)) 22%, var(--card)); border-color: var(--c, var(--accent)); }

  .note {
    background: color-mix(in srgb, var(--amarillo) 14%, var(--card));
    border: 2px dashed color-mix(in srgb, var(--amarillo) 60%, var(--line));
    border-radius: 16px; padding: 12px 14px; font-size: 16px;
  }
  .note b { display: block; margin-bottom: 2px; }
  .science { background: color-mix(in srgb, var(--azul) 10%, var(--card)); border-color: color-mix(in srgb, var(--azul) 45%, var(--line)); }

  .validate {
    font-size: 20px; font-weight: 700; padding: 14px 18px; border-radius: 18px;
    background: color-mix(in srgb, var(--c) 14%, var(--card));
    border-left: 8px solid var(--c);
  }

  /* Breathing stage */
  .stage { position: relative; width: min(78vw, 320px); aspect-ratio: 1; margin: 10px auto 6px; }
  .halo { position: absolute; inset: 0; border-radius: 50%; border: 3px dashed color-mix(in srgb, var(--c) 40%, transparent); }
  .globo {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 40%, #fff), var(--c));
    display: grid; place-items: center; transform: scale(.45); will-change: transform;
    box-shadow: 0 10px 40px color-mix(in srgb, var(--c) 40%, transparent);
  }
  .globo .emo { font-size: clamp(64px, 20vw, 110px); line-height: 1; }
  .globo.buzz .emo { animation: buzz .12s linear infinite; }
  @keyframes buzz { 0% { transform: translate(0,0); } 25% { transform: translate(1.5px,-1px); } 50% { transform: translate(-1px,1px); } 75% { transform: translate(1px,1.5px); } }
  .stage svg { width: 100%; height: 100%; overflow: visible; }
  .stage .dot { font-size: 40px; }
  .cue { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: clamp(26px, 6vw, 36px); min-height: 2.4em; display: flex; align-items: center; justify-content: center; text-align: center; }
  .count { font-family: "Baloo 2", sans-serif; font-size: 28px; color: var(--muted); min-height: 1.3em; }
  .rounds { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
  .rounds span { width: 14px; height: 14px; border-radius: 50%; background: var(--line); transition: background .3s; }
  .rounds span.done { background: var(--c); }
  .rounds span.now { background: color-mix(in srgb, var(--c) 50%, var(--line)); }

  .sticker { font-size: 96px; display: inline-block; animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.2) rotate(-20deg); } to { transform: none; } }
  .sticker-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .sticker-cell { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 6px; text-align: center; }
  .sticker-cell .e { font-size: 44px; display: block; }
  .sticker-cell.locked .e { filter: grayscale(1); opacity: .25; }
  .sticker-cell small { color: var(--muted); font-size: 13px; display: block; }

  .range { width: 100%; accent-color: var(--c, var(--accent)); height: 36px; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 26px; }

  .summary { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; font-weight: 700; }
  .pill { padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, var(--card)); border: 2px solid var(--c); }

  .guide h3 { margin-top: 22px; }
  .guide ul { padding-left: 22px; margin: 6px 0; }
  .guide li { margin: 4px 0; }
  [hidden] { display: none !important; }
  .topnav { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
  .back {
    border: 2px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px 16px; font-weight: 800; font-size: 16px; min-height: 44px;
  }
  .back:hover, .back:focus-visible { border-color: var(--accent); outline: none; }
  .text-in {
    width: 100%; font: inherit; font-size: 22px; padding: 12px 16px; margin-top: 8px;
    border: 3px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink);
  }
  .text-in:focus { outline: none; border-color: var(--accent); }
  .avatar-grid { display: grid; gap: 10px; margin-top: 10px; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
  .avatar { font-size: 36px; border: 3px solid var(--line); background: var(--card); border-radius: 18px; padding: 8px; min-height: 64px; }
  .avatar[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
  .profile { text-align: center; }
  .profile.add { border-style: dashed; box-shadow: none; }
  .profile.editing { border-style: dashed; border-color: var(--accent); }
  .error { color: #B3261E; font-weight: 700; text-align: center; }
  .danger-zone { text-align: center; }
  .btn.danger { background: #C2453A; box-shadow: 0 4px 0 #8E2F27; }
  .footer-link { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 16px; padding: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .screen, .sticker { animation: none; }
    .globo.buzz .emo { animation: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <button class="brand" data-act="home" aria-label="Ir al inicio">🫧<span class="lbl"> Respira Conmigo</span></button>
  <button class="chip-btn player" id="player-chip" data-act="profiles" title="Cambiar de jugador" hidden></button>
  <button class="chip-btn" id="tgl-sound" data-act="toggle-sound" aria-pressed="true" title="Sonido" aria-label="Sonido">🔔<span class="lbl"> Sonido</span></button>
  <button class="chip-btn" id="tgl-voice" data-act="toggle-voice" aria-pressed="false" title="Voz que guía" aria-label="Voz que guía">🗣️<span class="lbl"> Voz</span></button>
</header>
<main id="app"></main>

<script>
/* =========================================================
   DATOS: edades, emociones/colores y respiraciones
   ========================================================= */

// tier = cómo hablamos y qué técnicas usamos en cada etapa
// inS/outS/holdS = segundos base; rounds = respiraciones por juego
const AGES = [
  { id: '3-5',   label: '3 a 5 años',  title: 'Semillitas',     emoji: '🌱', tier: 'mini', inS: 2.5, outS: 3,   holdS: 0,   rounds: 3, counts: false, mode: 'juntos', canSolo: false,
    blurb: 'Siempre con un adulto. Imágenes, sonidos y juego; 3 respiraciones bastan.' },
  { id: '6-8',   label: '6 a 8 años',  title: 'Exploradores',   emoji: '🧭', tier: 'kid',  inS: 3,   outS: 3.5, holdS: 1,   rounds: 4, counts: true,  mode: 'juntos', canSolo: true,
    blurb: 'Animales y colores, contamos juntos y empezamos a notar el cuerpo.' },
  { id: '9-12',  label: '9 a 12 años', title: 'Aventureros',    emoji: '🚀', tier: 'pre',  inS: 4,   outS: 4.5, holdS: 1.5, rounds: 5, counts: true,  mode: 'juntos', canSolo: true,
    blurb: 'Más palabras para las emociones, intensidad y por qué funciona.' },
  { id: '13-15', label: '13 a 15 años', title: 'Navegantes',    emoji: '⛵', tier: 'teen', inS: 4,   outS: 5,   holdS: 2,   rounds: 6, counts: true,  mode: 'solo',   canSolo: true,
    blurb: 'Técnicas reales con su ciencia. Con un adulto o por tu cuenta.' },
  { id: '16+',   label: '16 años o más', title: 'Por mi cuenta', emoji: '🌊', tier: 'teen', inS: 4,  outS: 5.5, holdS: 2,   rounds: 8, counts: true,  mode: 'solo',   canSolo: true,
    blurb: 'Práctica autónoma: elige tu técnica, tu ritmo y observa el cambio.' },
];

const TIER_ORDER = {
  mini: ['mini', 'kid', 'pre', 'teen'],
  kid:  ['kid', 'mini', 'pre', 'teen'],
  pre:  ['pre', 'teen', 'kid', 'mini'],
  teen: ['teen', 'pre', 'kid', 'mini'],
};
const TIER_RANK = { mini: 0, kid: 1, pre: 2, teen: 3 };

// Colores de emociones (inspirado en Zonas de Regulación y el Medidor de Ánimo de RULER)
const FEELINGS = {
  verde:    { color: 'var(--verde)',    emoji: '😊', minTier: 'mini',
              label: { mini: 'Feliz', kid: 'Feliz o en calma', pre: 'Verde: calma, alegría', teen: 'Verde: en calma, presente' },
              words: ['calma', 'alegría', 'gratitud', 'concentración', 'ganas de jugar', 'orgullo'],
              ex: { mini: ['flor', 'estrella'], kid: ['flor', 'estrella'], pre: ['estrella', 'flor'], teen: ['ola', 'estrella'] },
              msg: { mini: '¡Qué bien! Vamos a guardar esta calma en el corazón. 💚',
                     kid: '¡Te sientes en calma! Respirar ahora es como entrenar un superpoder para cuando lo necesites.',
                     pre: 'Practicar cuando estás en calma es lo que más ayuda: tu cuerpo aprende el camino para usarlo en momentos difíciles.',
                     teen: 'Entrenar en calma es como practicar antes del partido: el cuerpo aprende el camino y luego lo encuentra rápido bajo presión.' } },
  amarillo: { color: 'var(--amarillo)', emoji: '😬', minTier: 'kid',
              label: { kid: 'Con nervios', pre: 'Amarillo: nervios, inquietud', teen: 'Amarillo: estrés, ansiedad' },
              words: ['nervios', 'preocupación', 'estrés', 'inquietud', 'mucha emoción', 'impaciencia'],
              ex: { kid: ['abeja', 'flor'], pre: ['caja', 'abeja'], teen: ['caja', 'suspiro'] },
              msg: { kid: 'Cuando hay nervios, la panza se siente con mariposas. 🦋 ¡Vamos a calmarlas!',
                     pre: 'Los nervios y la preocupación aceleran el cuerpo. Vamos a ayudarlo a ir más despacio.',
                     teen: 'El estrés activa el modo alerta. Un ritmo de respiración constante le dice a tu cuerpo que puede bajar la guardia.' } },
  rojo:     { color: 'var(--rojo)',     emoji: '😠', minTier: 'mini',
              label: { mini: 'Con enojo', kid: 'Con enojo', pre: 'Rojo: enojo, furia', teen: 'Rojo: enojo, frustración' },
              words: ['enojo', 'frustración', 'furia', 'celos', 'injusticia', 'ganas de gritar'],
              ex: { mini: ['oso', 'leon'], kid: ['oso', 'leon'], pre: ['oso', 'leon'], teen: ['suspiro', 'oso'] },
              msg: { mini: 'El enojo es como un volcán. 🌋 ¡Vamos a enfriarlo juntos!',
                     kid: 'Sentir enojo está bien. Lo importante es lo que hacemos con él. Vamos a darle al cuerpo una pausa.',
                     pre: 'El enojo te avisa que algo te importa. Primero calmamos el cuerpo; después se piensa con más claridad.',
                     teen: 'El enojo acelera el corazón y la respiración. Unas pocas exhalaciones largas pueden bajar esa activación en un par de minutos.' } },
  morado:   { color: 'var(--morado)',   emoji: '😨', minTier: 'mini',
              label: { mini: 'Con miedo', kid: 'Con miedo', pre: 'Morado: miedo, susto', teen: 'Morado: miedo, inseguridad' },
              words: ['miedo', 'susto', 'inseguridad', 'vergüenza', 'incertidumbre', 'sentirme en peligro'],
              ex: { mini: ['tortuga', 'estrella'], kid: ['tortuga', 'estrella'], pre: ['tortuga', 'estrella'], teen: ['tortuga', 'estrella'] },
              msg: { mini: 'Cuando hay miedo, la tortuga se mete en su caparazón para sentirse segura. 🐢',
                     kid: 'El miedo es normal: nos ayuda a cuidarnos. Vamos a recordarle al cuerpo que está a salvo.',
                     pre: 'El miedo pone al cuerpo en alerta. Vamos a mostrarle que aquí y ahora estás a salvo.',
                     teen: 'El miedo enciende la alarma del cuerpo. Alargar la exhalación y sentir tus manos y pies te ayuda a volver al presente.' } },
  azul:     { color: 'var(--azul)',     emoji: '😢', minTier: 'mini',
              label: { mini: 'Triste', kid: 'Triste o con sueño', pre: 'Azul: tristeza, cansancio', teen: 'Azul: tristeza, cansancio' },

              ex: { mini: ['ballena', 'conejito'], kid: ['ballena', 'conejito'], pre: ['ballena', 'conejito'], teen: ['ballena', 'conejito'] },

                     kid: 'La tristeza también es importante. No hay que apurarla: vamos a acompañarla con una respiración suave.',
                     pre: 'La tristeza y el cansancio piden cuidado, no prisa. Respira suave y nota qué necesitas.',
                     teen: 'La tristeza y el cansancio piden cuidado, no prisa. Respira suave y nota qué necesitas de verdad.' } },
};
const FEEL_ORDER = ['verde', 'amarillo', 'rojo', 'morado', 'azul'];

const BODY_PARTS = ['🧠 Cabeza', '😶 Cara', '🗣️ Garganta', '💓 Pecho', '🫃 Panza', '✋ Manos', '🦵 Piernas', '🤷 No sé'];

// Fases: in (inhalar), out (exhalar), hold (pausa), sniff (olfateo corto)
// w = multiplicador del tiempo base de la edad; s = segundos fijos (por tier); to = nivel del globo (0..1)
const EX = {
  oso: {
    name: 'Respiración de oso', emoji: '🐻', color: 'var(--rojo)', visual: 'globo', minTier: 'mini',
    intro: {
      mini: 'El osito tiene mucha fuerza. Cuando siente enojo, respira GRANDE y suelta el aire despacito. ¡Hazlo como el oso!',

    phases: [
      { t: 'in',   cue: { mini: 'Huele la miel 🍯', kid: 'Infla tu panza de oso por la nariz', pre: 'Inhala por la nariz, llena la panza', teen: 'Inhala por la nariz' } },
      { t: 'hold', w: 1, cue: { mini: 'Quieto como un oso', teen: 'Pausa breve' } },
      { t: 'out',  w: 1.3, cue: { mini: 'Suelta el aire: ahhh…', kid: 'Suelta despacito por la boca: ahhh…', teen: 'Exhala lento por la boca' } },
    ],
    ending: { juntos: '¡Ahora dense un ABRAZO DE OSO bien apretado! 🤗', solo: 'Cruza los brazos y date un abrazo de oso: aprieta suave… y suelta. 🤗' },
    adult: 'Ponte a su altura y exagera tu respiración para que te imite: tu calma es contagiosa. Ofrece el abrazo al final, sin imponerlo.',
    why: 'Cuando la exhalación dura más que la inhalación, el corazón se desacelera un poco y se activa el sistema nervioso parasimpático: el “freno” natural del cuerpo.',
  },
  leon: {
    name: 'Rugido de león', emoji: '🦁', color: 'var(--rojo)', visual: 'globo', minTier: 'mini',
    intro: {
      mini: '¡El león tiene un rugido enorme! Vamos a sacar el enojo rugiendo.',
      kid: 'El león no se guarda el enojo: lo saca con un gran rugido. Toma aire por la nariz, abre bien la boca, saca la lengua… ¡y ruge!',

    phases: [
      { t: 'in',  cue: { mini: 'Toma aire y saca tus garras 🐾', kid: 'Inhala por la nariz y estira tus garras 🐾' } },

    ],
    ending: { juntos: 'Rujan una última vez… y ahora escuchen el silencio. ¿Qué cambió en tu cuerpo?', solo: 'Un último rugido… y ahora escucha el silencio. ¿Qué cambió en tu cuerpo?' },
    adult: 'Ruge con ellos y haz caras graciosas: el juego también regula. Es ideal para descargar energía antes de una respiración más lenta, como la del oso.',
    why: 'Una exhalación fuerte y sonora libera tensión muscular y convierte la emoción en juego, lo que facilita pasar después a una respiración lenta.',
  },
  suspiro: {

    intro: {

      teen: 'El “suspiro fisiológico”: doble inhalación por la nariz + exhalación larga por la boca. Es una de las formas más rápidas que tiene tu cuerpo de soltar tensión.' },

}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- sonido y voz ---------- */
let audioCtx = null;
function chime(freq) {
  if (!store.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 1);
  } catch (e) { /* audio no disponible */ }
}
function speak(text) {
  if (!store.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\p{Extended_Pictographic}|️|‍/gu, '').trim());
    u.lang = 'es-ES'; u.rate = 0.85; u.pitch = 1.1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { /* voz no disponible */ }
}
function syncToggles() {
  document.getElementById('tgl-sound').setAttribute('aria-pressed', String(store.sound));
  document.getElementById('tgl-voice').setAttribute('aria-pressed', String(store.voice));
}

function saveProfile() {
  const name = document.getElementById('pf-name').value.trim().slice(0, 20);
  if (!name) { document.getElementById('pf-error').hidden = false; document.getElementById('pf-name').focus(); return; }
  if (draft.id) {
    Object.assign(store.profiles.find(x => x.id === draft.id), { name, avatar: draft.avatar, ageId: draft.ageId });
    saveStore(); screenProfiles(); return;
  }
  const p = { id: 'p' + Date.now().toString(36), name, avatar: draft.avatar, ageId: draft.ageId, mode: null, stickers: {} };
  if (legacyStickers && !store.profiles.length) p.stickers = legacyStickers;
  store.profiles.push(p);
  S.managing = false;
  enterProfile(p);
}

/* ---------- el motor de respiración ---------- */
let run = null;
function stopRun() {
  if (run) { cancelAnimationFrame(run.raf); run = null; }
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
}

function buildTimeline(ex) {
  const a = S.age, seq = [];
  const rounds = ex.rounds || a.rounds;
  for (let r = 0; r < rounds; r++) {
    for (const p of ex.phases) {
      let d;
      if (p.s != null) d = pick(p.s);
      else if (p.t === 'in') d = a.inS * (p.w || 1);
      else if (p.t === 'out') d = a.outS * (p.w || 1);
      else if (p.t === 'hold') { if (!a.holdS) continue; d = a.holdS * (p.w || 1); } // sin retención para los más pequeños
      else if (p.t === 'sniff') d = 0.7;
      seq.push(Object.assign({}, p, { d, round: r }));
    }
  }
  return seq;
}

const ease = k => 0.5 - Math.cos(Math.PI * k) / 2;

function pathPoints(kind) {
  if (kind === 'caja') return [[60, 240], [60, 60], [240, 60], [240, 240]];
  const pts = [];
  for (let k = 0; k < 10; k++) {
    const ang = (-126 + 36 * k) * Math.PI / 180, r = k % 2 ? 125 : 55;
    pts.push([150 + r * Math.cos(ang), 150 + r * Math.sin(ang)]);
  }
  return pts;
}

function screenBreath() {
  const ex = EX[S.exId];
  const c = (S.feel && !S.fromLibrary) ? FEELINGS[S.feel].color : ex.color;
  const rounds = ex.rounds || S.age.rounds;
  let stage;
  if (ex.visual === 'globo') {
    stage = `<div class="halo"></div><div class="globo" id="globo"><span class="emo" id="emo">${ex.emoji}</span></div>`;
  } else {
    const pts = pathPoints(ex.visual);
    const poly = pts.map(p => p.join(',')).join(' ');
    stage = `<svg viewBox="0 0 300 300" aria-hidden="true">
      <polygon points="${poly}" fill="color-mix(in srgb, ${c} 14%, transparent)" stroke="${c}" stroke-width="8" stroke-linejoin="round"/>
      <line id="seg" x1="0" y1="0" x2="0" y2="0" stroke="${c}" stroke-width="14" stroke-linecap="round" opacity=".35"/>
      <text id="dot" class="dot" x="${pts[0][0]}" y="${pts[0][1]}" text-anchor="middle" dominant-baseline="central">${ex.emoji}</text>
    </svg>`;
  }
  render(`
    <div class="center" style="--c:${c}">
      <p class="lead" style="margin:4px 0 0">${ex.emoji} ${esc(ex.name)}</p>
      <div class="stage" id="stage">${stage}</div>
      <div class="cue" id="cue" aria-live="polite">Prepárate…</div>
      <div class="count" id="count"></div>
      <div class="rounds" id="rounds">${Array.from({ length: rounds }, () => '<span></span>').join('')}</div>
      <div class="btn-row">
        <button class="btn ghost" data-act="pause" id="pause-btn">⏸ Pausa</button>
        <button class="btn ghost" data-act="finish">Terminar</button>
      </div>
      ${isJuntos() ? `<p style="color:var(--muted);font-size:15px;margin-top:16px">👩‍👧 Respira tú también, más lento y exagerado. Si aparece mareo, paren y respiren normal.</p>` : ''}
    </div>
  `);
  startRun(ex);
}

function startRun(ex) {
  const seq = [{ t: 'ready', d: 3, cue: 'Prepárate…', round: -1 }].concat(buildTimeline(ex));
  const now = performance.now();
  run = { ex, seq, i: -1, level: 0, from: 0, to: 0, start: now, paused: false, pausedAt: 0, raf: 0,
          pts: ex.visual !== 'globo' ? pathPoints(ex.visual) : null,
          els: { globo: document.getElementById('globo'), emo: document.getElementById('emo'), dot: document.getElementById('dot'),
                 seg: document.getElementById('seg'), cue: document.getElementById('cue'), count: document.getElementById('count'),
                 rounds: document.querySelectorAll('#rounds span') } };
  nextPhase(now);
  run.raf = requestAnimationFrame(tick);
}

function nextPhase(now) {
  run.i++;
  if (run.i >= run.seq.length) { const done = run; run = null; cancelAnimationFrame(done.raf); screenEnding(); return false; }
  const p = run.seq[run.i];
  run.from = run.level; run.start = now;
  run.to = p.to != null ? p.to : p.t === 'in' ? 1 : p.t === 'out' ? 0 : run.level;
  const cue = pick(p.cue) || (p.t === 'hold' ? 'Pausa suave…' : '');
  run.els.cue.textContent = cue;
  if (run.els.emo) run.els.emo.textContent = p.emoji || run.ex.emoji;
  if (run.els.globo) run.els.globo.classList.toggle('buzz', !!p.buzz);
  run.els.rounds.forEach((el, k) => { el.className = k < p.round ? 'done' : k === p.round ? 'now' : ''; });
  if (p.t !== 'ready') {
    chime(p.t === 'in' || p.t === 'sniff' ? 523 : p.t === 'out' ? 392 : 440);
    if (p.t !== 'sniff' || p.cue !== 'Snif') speak(cue);
  }
  return true;
}

function tick(now) {
  if (!run) return;
  if (!run.paused) {
    const p = run.seq[run.i];
    const k = Math.min(1, (now - run.start) / 1000 / p.d);
    run.level = run.from + (run.to - run.from) * ease(k);
    if (run.els.globo) {
      run.els.globo.style.transform = `scale(${0.45 + 0.55 * run.level})`;
    } else if (run.pts && p.t !== 'ready') {
      const idx = run.i - 1, n = run.pts.length;
      const A = run.pts[idx % n], B = run.pts[(idx + 1) % n], e = ease(k);
      const x = A[0] + (B[0] - A[0]) * e, y = A[1] + (B[1] - A[1]) * e;
      run.els.dot.setAttribute('x', x); run.els.dot.setAttribute('y', y);
      run.els.seg.setAttribute('x1', A[0]); run.els.seg.setAttribute('y1', A[1]);
      run.els.seg.setAttribute('x2', x); run.els.seg.setAttribute('y2', y);
    }
    const left = Math.ceil(p.d - (now - run.start) / 1000);
    run.els.count.textContent = (p.t === 'ready' || (S.age.counts && p.t !== 'sniff')) && left > 0 ? left : '';
    if (k >= 1 && !nextPhase(now)) return;
  }
  run.raf = requestAnimationFrame(tick);
}

function togglePause() {
  if (!run) return;
  const btn = document.getElementById('pause-btn');
  if (run.paused) {
    run.start += performance.now() - run.pausedAt;
    run.paused = false; btn.textContent = '⏸ Pausa';
  } else {
    run.paused = true; run.pausedAt = performance.now(); btn.textContent = '▶ Seguir';
    run.els.cue.textContent = 'En pausa: respira normal';
  }
}

  switch (act) {
    case 'home': case 'profiles': S.managing = false; screenProfiles(); break;

    case 'new-profile': screenProfileEdit(null); break;

    case 'pick-profile': enterProfile(store.profiles.find(p => p.id === id)); break;

      break;
    case 'pf-age':
      draft.ageId = draft.ageId === id ? null : id;
      document.querySelectorAll('[data-act="pf-age"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === draft.ageId)));
      break;
    case 'pf-save': saveProfile(); break;
    case 'pf-delete': {
      const p = store.profiles.find(x => x.id === draft.id);
      document.getElementById('del-zone').innerHTML = `
        <p style="font-weight:700">¿Borrar el perfil de ${esc(p.name)}? También se borran sus stickers.</p>
        <div class="btn-row"><button class="btn danger" data-act="pf-delete-yes">Sí, borrar</button><button class="btn ghost" data-act="edit-profile" data-id="${p.id}">Cancelar</button></div>`;
      break;
    }
    case 'pf-delete-yes':
      store.profiles = store.profiles.filter(x => x.id !== draft.id);
      if (!store.profiles.length) S.managing = false;
      saveStore(); screenProfiles(); break;
    case 'to-age': screenAge(); break;
    case 'details': screenDetails(); break;
    case 'guide': screenGuide(); break;
    case 'age':
      S.age = AGES.find(a => a.id === id);
      player().ageId = id; saveStore();
      afterAge(true);
      break;
    case 'to-mode': screenMode(); break;
    case 'mode': S.mode = id; player().mode = id; saveStore(); screenMenu(); break;
    case 'menu': if (!S.age) return screenProfiles(); if (!S.mode) S.mode = S.age.mode; screenMenu(); break;
    case 'checkin':
      Object.assign(S, { feel: null, words: [], body: [], intensity: 3, post: null, postIntensity: 3, fromLibrary: false });
      screenCheckin(false); break;
    case 'feel': S.feel = id; screenDetails(); break;
    case 'word': toggleIn(S.words, id); el.setAttribute('aria-pressed', String(S.words.includes(id))); break;
    case 'body': toggleIn(S.body, id); el.setAttribute('aria-pressed', String(S.body.includes(id))); break;
    case 'details-done': screenIntro(pick(FEELINGS[S.feel].ex).find(x => allowed(EX[x].minTier))); break;
    case 'intro': screenIntro(id); break;
    case 'start': screenBreath(); break;
    case 'pause': togglePause(); break;
    case 'finish': stopRun(); screenEnding(); break;
    case 'post': screenCheckin(true); break;
    case 'post-feel':
      S.post = id;
      if (TIER_RANK[tier()] >= TIER_RANK.pre) { S.postIntensity = S.post === S.feel ? S.intensity : 3; screenPostIntensity(); }
      else screenReward();
      break;
    case 'reward': screenReward(); break;
    case 'try-alt':
      // nueva vuelta con el color actual
      Object.assign(S, { feel: S.post, intensity: S.postIntensity, post: null, postIntensity: 3, fromLibrary: false });
      screenIntro(id); break;
    case 'library': screenLibrary(); break;
    case 'lib-pick': S.fromLibrary = true; screenIntro(id); break;
    case 'collection': screenCollection(); break;
    case 'toggle-sound': store.sound = !store.sound; saveStore(); syncToggles(); if (store.sound) chime(523); break;
    case 'toggle-voice': store.voice = !store.voice; saveStore(); syncToggles(); if (store.voice) speak('Hola, vamos a respirar juntos'); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act === 'intensity') S.intensity = +el.value;
  else if (el.dataset.act === 'post-intensity') S.postIntensity = +el.value;
  else return;
  const out = document.getElementById('int-val');
  if (out) out.textContent = el.value;
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pf-name') saveProfile();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && run && !run.paused) togglePause();
});

syncToggles();
screenProfiles();
</script>
</body>
</html>
